[workspace]
members = ["crates/core", "crates/probe", "crates/store", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Latency and loss monitoring with smoke graphs, a modern SmokePing"

[workspace.dependencies]
haze-core = { path = "crates/core" }
haze-probe = { path = "crates/probe" }
haze-store = { path = "crates/store" }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
crc32fast = "1.4"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "io-util", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = { version = "1.2", features = ["preserve_order"] }
webpki-roots = "1.0"
x509-parser = "0.18"

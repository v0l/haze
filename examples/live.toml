[defaults]
step = "15s"
pings = 10
timeout = "2s"

[storage]
dir = "demo-data"

[web]
listen = "127.0.0.1:8480"

[alerts.loss]
when = "loss >= 10% for 3 steps"
comment = "sustained packet loss"

[alerts.slow]
when = "median > 2x baseline 3 of 5"
baseline_steps = 60

[alerts.smoky]
when = "smoke > 1ms 2 of 3"
comment = "the spread between p10 and p90 is over 1 ms"

[targets.ping]
tags = ["icmp", "anycast"]
alerts = ["loss", "slow", "smoky"]

[targets.ping.cloudflare]
host = "1.1.1.1"

[targets.ping.google]
host = "8.8.8.8"

[targets.dns]
tags = ["dns", "anycast"]
alerts = ["loss", "slow"]
probe = "dns"
name = "example.com"
pings = 5

[targets.dns.cloudflare]
title = "example.com A from 1.1.1.1"
host = "1.1.1.1"

[targets.dns.google]
title = "example.com A from 8.8.8.8"
host = "8.8.8.8"

[defaults]
step = "60s"
pings = 20
timeout = "2s"

[storage]
dir = "data"

[web]
listen = "127.0.0.1:8480"

[alerts.loss]
when = "loss >= 10% for 3 steps"
comment = "sustained packet loss"

[alerts.slow]
when = "median > 2x baseline 3 of 5"
baseline_steps = 60

[targets.ping]
tags = ["icmp", "anycast"]
alerts = ["loss", "slow"]

[targets.ping.cloudflare]
host = "1.1.1.1"

[targets.ping.google]
host = "8.8.8.8"

[targets.dns]
tags = ["dns", "anycast"]
alerts = ["loss", "slow"]
probe = "dns"
name = "example.com"
pings = 10

[targets.dns.cloudflare]
host = "1.1.1.1"

[targets.dns.google]
host = "8.8.8.8"

[targets.nostr.snort]
title = "relay.snort.social REQ to EOSE"
url = "wss://relay.snort.social"
pings = 5
timeout = "5s"
tags = ["nostr"]
alerts = ["loss"]
